<!doctype html>
<html lang="pt-br" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Portal de Notícias{% endblock %}</title>
    {% block meta %}{% endblock %}
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #fff;
        --text: #1a1d21;
        --muted: #6b7280;
        --accent: #c8102e;
        --border: #e5e7eb;
      }
      [data-theme="dark"] {
        --bg: #0f1114;
        --card: #181b20;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --accent: #ff4d63;
        --border: #2a2e35;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 16px;
      }

      header {
        background: var(--card);
        border-bottom: 3px solid var(--accent);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .topo {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 0;
      }
      .logo {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--accent);
      }
      .acoes {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .acoes input {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
      }
      .acoes button {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        cursor: pointer;
      }
      nav {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        padding-bottom: 10px;
      }
      nav a {
        white-space: nowrap;
        font-size: 0.9rem;
        color: var(--muted);
        font-weight: 600;
      }
      nav a:hover {
        color: var(--accent);
      }

      .destaques {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 16px;
        margin: 24px 0;
      }
      .destaque {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        min-height: 220px;
        background: #222;
      }
      .destaque:first-child {
        grid-row: span 2;
        min-height: 420px;
      }
      .destaque img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        inset: 0;
      }
      .destaque .texto {
        position: absolute;
        bottom: 0;
        padding: 20px;
        color: #fff;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
        width: 100%;
      }
      .destaque h2 {
        font-size: 1.2rem;
      }
      .destaque:first-child h2 {
        font-size: 1.8rem;
      }

      .tag {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 4px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        margin-bottom: 32px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        transition: transform 0.15s;
      }
      .card:hover {
        transform: translateY(-3px);
      }
      .card img {
        width: 100%;
        height: 170px;
        object-fit: cover;
        display: block;
      }
      .card .corpo {
        padding: 14px;
      }
      .card h3 {
        font-size: 1.05rem;
        margin: 6px 0;
      }
      .card p {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .data {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .paginacao {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin: 24px 0 40px;
      }
      .paginacao a {
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
      }

      article.materia {
        max-width: 760px;
        margin: 32px auto;
        background: var(--card);
        padding: 28px;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      article.materia h1 {
        font-size: 2rem;
        line-height: 1.2;
        margin: 8px 0;
      }
      article.materia img {
        width: 100%;
        border-radius: 10px;
        margin: 16px 0;
      }
      article.materia .conteudo {
        font-size: 1.08rem;
        white-space: pre-line;
      }

      footer {
        text-align: center;
        color: var(--muted);
        padding: 30px 0;
        border-top: 1px solid var(--border);
        font-size: 0.85rem;
      }

      @media (max-width: 720px) {
        .destaques {
          grid-template-columns: 1fr;
        }
        .destaque:first-child {
          min-height: 280px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="topo">
          <a href="{% url 'home' %}" class="logo"
            >PORTAL<span style="color: var(--text)">NEWS</span></a
          >
          <div class="acoes">
            <form method="get" action="{% url 'home' %}">
              <input
                type="search"
                name="q"
                placeholder="Buscar..."
                value="{{ request.GET.q }}"
              />
            </form>
            <button id="tema" type="button">🌓</button>
          </div>
        </div>
        <nav>
          <a href="{% url 'home' %}">Início</a>
          {% for c in categorias %}
          <a href="{% url 'categoria' c.slug %}">{{ c.nome }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>

    <main class="container">{% block content %}{% endblock %}</main>

    <footer>© {% now "Y" %} Portal News</footer>

    <script>
      const root = document.documentElement;
      const salvo = localStorage.getItem("tema");
      if (salvo) root.dataset.theme = salvo;
      document.getElementById("tema").onclick = () => {
        const novo = root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = novo;
        localStorage.setItem("tema", novo);
      };
    </script>
  </body>
</html>
